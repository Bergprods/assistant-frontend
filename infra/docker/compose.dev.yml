version: "3.9"
services:
  frontend:
    build:
      context: ../../frontend
      target: builder
    volumes:
      # Mount source code into container
      - ../../frontend:/app:delegated
      # Preserve node_modules from the builder image
      - "node_modules:/app/node_modules"
    ports:
      # Use a different host port to avoid conflict with local dev
      - "5175:5174"
    command: npm run dev
    networks:
      - appnet

volumes:
  # Named volume to store node_modules from builder image
  node_modules: {}
networks:
  appnet:
    driver: bridge
